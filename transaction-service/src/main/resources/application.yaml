server:
  port: 8083

spring:
  application:
    name: transaction-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:transaction-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transaction_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  kafka:
    retry:
      max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:3}
      interval-ms: ${KAFKA_RETRY_INTERVAL_MS:1000}
    topics:
      transfer-requested: ${TRANSACTION_TRANSFER_REQUESTED_TOPIC:transaction.transfer.requested}
      transfer-completed: ${TRANSACTION_TRANSFER_COMPLETED_TOPIC:transaction.transfer.completed}
      transfer-failed: ${TRANSACTION_TRANSFER_FAILED_TOPIC:transaction.transfer.failed}
  outbox:
    publish-interval-ms: ${OUTBOX_PUBLISH_INTERVAL_MS:1000}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
