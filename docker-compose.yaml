services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  user-service:
    build:
      context: ./user-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/user_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: mysecretkey
    expose:
      - "8081"

  account-service:
    build:
      context: ./account-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/account_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: mysecretkey
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TRANSACTION_TRANSFER_REQUESTED_TOPIC: transaction.transfer.requested
      TRANSACTION_TRANSFER_COMPLETED_TOPIC: transaction.transfer.completed
      TRANSACTION_TRANSFER_FAILED_TOPIC: transaction.transfer.failed
      KAFKA_RETRY_MAX_ATTEMPTS: 3
      KAFKA_RETRY_INTERVAL_MS: 1000
    expose:
      - "8082"

  transaction-service:
    build:
      context: ./transaction-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/transaction_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TRANSACTION_TRANSFER_REQUESTED_TOPIC: transaction.transfer.requested
      TRANSACTION_TRANSFER_COMPLETED_TOPIC: transaction.transfer.completed
      TRANSACTION_TRANSFER_FAILED_TOPIC: transaction.transfer.failed
      KAFKA_RETRY_MAX_ATTEMPTS: 3
      KAFKA_RETRY_INTERVAL_MS: 1000
    expose:
      - "8083"

  api-gateway:
    build:
      context: ./api-gateway
    depends_on:
      - user-service
      - account-service
      - transaction-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JWT_SECRET: mysecretkey
      USER_SERVICE_URL: http://user-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8082
      TRANSACTION_SERVICE_URL: http://transaction-service:8083
    ports:
      - "8080:8080"
