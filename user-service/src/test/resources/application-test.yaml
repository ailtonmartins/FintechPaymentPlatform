spring:
  datasource:
    url: jdbc:h2:mem:user-service-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: segredo-de-teste
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000
