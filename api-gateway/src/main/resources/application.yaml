server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/me,/api/v1/users/**

            - id: account-service
              uri: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/accounts/**

            - id: transaction-service
              uri: ${TRANSACTION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/transactions/**

            - id: user-service-api-docs
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/user-service/v3/api-docs
              filters:
                - RewritePath=/user-service/v3/api-docs,/v3/api-docs

            - id: account-service-api-docs
              uri: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/account-service/v3/api-docs
              filters:
                - RewritePath=/account-service/v3/api-docs,/v3/api-docs

            - id: transaction-service-api-docs
              uri: ${TRANSACTION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/transaction-service/v3/api-docs
              filters:
                - RewritePath=/transaction-service/v3/api-docs,/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: User Service
        url: /user-service/v3/api-docs
      - name: Account Service
        url: /account-service/v3/api-docs
      - name: Transaction Service
        url: /transaction-service/v3/api-docs
    disable-swagger-default-url: true

jwt:
  secret: ${JWT_SECRET}
